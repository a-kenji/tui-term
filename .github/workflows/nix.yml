name: "nix"

on:
  workflow_dispatch: # allows manual triggering
  pull_request:
    branches: [ release, development ]
    paths-ignore:
      - '**.md'
  push:
    branches: [ release, development ]
    paths-ignore:
      - '**.md'
  merge_group:

jobs:
  clippy:
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Nix Flakes doesn't work on shallow clones
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@v17
      with:
        name: kenji
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: "cargo clippy"
      run: nix develop --command cargo clippy

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@v17
      with:
        name: kenji
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: "cargo deny"
      run: nix develop .#ciShell --command cargo deny check licenses sources

  cargo-udeps:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@v17
      with:
        name: kenji
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: "cargo udeps"
      run: nix develop .#ciShell --command cargo udeps

  treefmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@v17
      with:
        name: kenji
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: "treefmt"
      run: nix build -Lvv .#checks.x86_64-linux.treefmt

  documentation:
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@v17
      with:
        name: kenji
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: "build documentation"
      run: |
        nix develop
        cargo doc --all-features --document-private-items

  dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@v17
      with:
        name: kenji
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: "build dependencies"
      run: nix build -Lvv .#checks.x86_64-linux.cargoArtifacts

  dependencies-msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@v17
      with:
        name: kenji
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: "build dependencies msrv"
      run: nix build -Lvv .#checks.x86_64-linux.cargoArtifactsMSRV

  build-examples:
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@v17
      with:
        name: kenji
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: "build examples"
      run: |
        nix build -Lvv .#checks.x86_64-linux.simple_ls_chan
        nix build -Lvv .#checks.x86_64-linux.simple_ls_rw
        nix build -Lvv .#checks.x86_64-linux.smux
        nix build -Lvv .#checks.x86_64-linux.nested_shell
        nix build -Lvv .#checks.x86_64-linux.nested_shell_async
        nix build -Lvv .#checks.x86_64-linux.long_running

  cargo-test:
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@v17
      with:
        name: kenji
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: "cargo test"
      run: |
        echo "This runs cargo-nextest"
        nix build -Lvv .#checks.x86_64-linux.cargoNextest

  cargo-doc:
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@v17
      with:
        name: kenji
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: "cargo doc"
      run: nix build -Lvv .#checks.x86_64-linux.cargoDoc

  typos:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@v17
      with:
        name: kenji
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: "typos"
      run: nix develop -Lv .#ciShell --command typos

  all:
    name: All checks passed
    if: always()
    runs-on: ubuntu-latest
    needs:
      - clippy
      - cargo-deny
      - cargo-udeps
      - treefmt
      - documentation
      - dependencies
      - dependencies-msrv
      - build-examples
      - cargo-test
      - cargo-doc
      - typos
    steps:
      - name: "verify all jobs passed"
        run: |
          if [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.cargo-deny.result }}" != "success" ]] || \
             [[ "${{ needs.cargo-udeps.result }}" != "success" ]] || \
             [[ "${{ needs.treefmt.result }}" != "success" ]] || \
             [[ "${{ needs.documentation.result }}" != "success" ]] || \
             [[ "${{ needs.dependencies.result }}" != "success" ]] || \
             [[ "${{ needs.dependencies-msrv.result }}" != "success" ]] || \
             [[ "${{ needs.build-examples.result }}" != "success" ]] || \
             [[ "${{ needs.cargo-test.result }}" != "success" ]] || \
             [[ "${{ needs.cargo-doc.result }}" != "success" ]] || \
             [[ "${{ needs.typos.result }}" != "success" ]]; then
            echo "Some checks failed"
            exit 1
          fi
